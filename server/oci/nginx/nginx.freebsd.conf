# The FreeBSD proxy image's main nginx configuration.
#
# It holds exactly what is BASE-SPECIFIC -- where nginx writes, what user it
# would run as, how it logs -- and `include`s `claudio.conf`, which holds the
# routes and is shared with the Linux proxy image byte for byte.  Splitting
# them that way is the same rule the entrypoint follows: the thing that differs
# between two bases is small and lives in one place, and the decision everybody
# reads is stated once.
#
# THERE IS NO `user` DIRECTIVE, AND THAT IS DELIBERATE.
#
#   The image runs as 65534:65534, and `user` is meaningful only when the
#   master process is root.  With it, nginx prints "the 'user' directive makes
#   sense only if the master process runs with super-user privileges" on every
#   start -- a warning that trains people to ignore warnings.  Without it, the
#   workers simply inherit the uid the container was given, which is the one
#   the operator can actually change.
#
# THERE IS NO `daemon off;` HERE EITHER.
#
#   The ENTRYPOINT passes `-g "daemon off;"`.  Both would be a duplicate
#   directive and nginx refuses to start on it, so this file must stay silent
#   about it -- and the entrypoint is the right half to carry it, because it
#   survives an operator mounting their own configuration over this one.

worker_processes auto;

# COMPILED-IN, AND UNWRITABLE BY THIS IMAGE'S UID.  `/var/run` belongs to the
# base image and this build has no RUN to chown it with, so the pid file is
# moved into the one directory the staging step does chown.  Without this line
# nginx exits at startup with "open() /var/run/nginx.pid failed (13:
# Permission denied)".
pid /var/tmp/nginx/nginx.pid;

# `stderr` is nginx's own keyword for the standard error stream, so this needs
# no device node.  `/var/log/nginx` is still staged and still writable -- nginx
# opens its compiled-in default before it has read this file, and an operator
# who prefers files should not have to rebuild the image to get them.
error_log stderr notice;

events {
    worker_connections 1024;
}

http {
    # `mime.types` is installed by the STAGING step from the `mime.types-dist`
    # the package ships, because pkg's post-install script is what normally
    # does it and there is no RUN here to run one with.  The staging step
    # refuses rather than warning if it is absent, since this include is what
    # would fail -- at startup, on somebody else's machine.
    include       mime.types;
    default_type  application/octet-stream;

    log_format claudio '$remote_addr $request_method $uri $status '
                       '$body_bytes_sent ${request_time}s '
                       'ua="$http_user_agent"';

    # `/dev/stdout` rather than a file, so `docker logs` and `podman logs` show
    # requests.  FreeBSD's devfs provides the node, which is why this works
    # without the symlink farm a Linux image relies on -- but it does depend on
    # the runtime mounting devfs into the container, and if it does not, nginx
    # refuses to start and says which file it could not open.  Loud, which is
    # the direction this project wants; the remedy is one line in
    # `/etc/claudio/nginx.d/http-*.conf` pointing the log at /var/log/nginx.
    access_log /dev/stdout claudio;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout  65;

    # The temporary directories are nginx's compiled-in ones --
    # `/var/tmp/nginx/{client_body,proxy,fastcgi,uwsgi,scgi}_temp`, read out of
    # the real binary rather than guessed -- and the staging step chowns them
    # to 65534.  They are not restated here: two spellings of one path is how
    # an image ends up writable in the configuration and not on disk.

    # The routes.  Shared with the Linux proxy image, byte for byte.
    include /usr/local/etc/nginx/claudio.conf;

    # TLS.  Also shared byte for byte, and also SHIPPED rather than mounted:
    # `entrypoint-proxy.sh` guarantees a certificate exists before nginx starts,
    # which is the condition that used to make shipping this unsafe.
    include /usr/local/etc/nginx/claudio-tls.conf;

    # The operator's own server blocks -- a TLS terminator is the expected one.
    # `http-*.conf` here and `server-*.conf` inside the server block, so the two
    # globs cannot pick up each other's files.  A glob matching nothing is not
    # an error, so the image starts with nothing mounted.
    include /etc/claudio/nginx.d/http-*.conf;
}
