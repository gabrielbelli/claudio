# THE ROUTES THEMSELVES, in a file of their own so that the plain-HTTP server
# and an operator's TLS server are the SAME routes rather than two copies.
#
# `claudio.conf` includes this inside its `server { }` on 8080; the TLS server
# block in `http-tls.conf.example` includes exactly this file too.  A second
# copy of a location list is how a route gets fixed on one listener and not the
# other -- and the one that would go stale is the one facing the internet.
#
# Shared with the Linux proxy image byte for byte.  Nothing here names a path
# on disk, a user or a log: those are the base's business and live in the main
# configuration.

    # The proxy is not the thing that says what it is.
    server_tokens off;

    # 32m is `serve.MAX_BODY` and 1m is `mcp.MAX_BODY` -- TWO MODULES, because
    # since the split those are two processes' numbers rather than one's.  A
    # test reads both off the MODULES and compares them with the two lines
    # below, because the two ways of getting this wrong are both bad in a way
    # nobody sees at the time: a SMALLER limit here means a caller meets a 413
    # from nginx carrying none of the process's own explanation, and a LARGER
    # one means nginx buffers a whole body the process is about to refuse.
    # Equal, the refusal comes from the process that knows why.
    client_max_body_size 32m;

    # ---- the shipper's door ---------------------------------------------
    #
    # An exact-match location with a URI in `proxy_pass`, so `/sender` is
    # REPLACED by `/v1/ship` rather than appended to.  The external name is
    # the user's; the internal one is the wire protocol's and does not change.
    #
    # `claudio_ingest`, AND THAT IS THE HALF OF THE SPLIT A ROUTE CAN GET
    # WRONG.  This is the only route that reaches a process holding the store
    # read-write, holding `door.lock` and able to append a byte.  Pointing it
    # at `claudio_api` would meet a 503 `no-ship` -- named, so it would be
    # found -- but pointing `/api/` at `claudio_ingest` would meet a 503
    # `no-view`, and pointing BOTH at one whole-door upstream would silently
    # undo the split while every request kept working.  The last one is the
    # dangerous one, and it is why the upstream names say which half they are.
    location = /sender {
        proxy_pass http://claudio_ingest/v1/ship;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # A shipment is one byte range of one file and the door acknowledges
        # only after fsync, so this waits rather than giving up: a client that
        # does not get its 200 resends the identical bytes, which is safe but
        # costs the whole batch again.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        # Buffering a 32 MiB body to disk before the door sees it doubles the
        # write.  Off, so the door streams it.
        proxy_request_buffering off;
    }

    # ---- the read API ---------------------------------------------------
    #
    # NO URI in `proxy_pass` and no `rewrite`: the path is passed through
    # unchanged, so `/api/v1/search` here is `/api/v1/search` there.  See the
    # paragraph at the top -- the door's own OpenAPI document, capabilities
    # list and refusal remedies are absolute paths under this prefix, and the
    # MCP surface builds every tool it has out of them.
    #
    # Reader tokens are the door's, not this file's.  The `Authorization`
    # header is forwarded untouched (nginx does not strip it), so a reader's
    # scope is decided in exactly one place, by the same `readers.json` that
    # gates a served MCP.  This proxy adds no authentication of its own and
    # must not be given any: a second gate here would be a second place for
    # scope to be decided.
    # ONE MEASURED SIDE EFFECT, RECORDED SO NOBODY "FIXES" IT.  A location whose
    # name ends in `/` with a `proxy_pass` carrying no URI sets nginx's
    # `auto_redirect`, so a request for `/api` -- no trailing slash -- is
    # answered `301 -> /api/` rather than falling through to the catch-all's
    # 404.  Measured against a live nginx with stub upstreams.  That is the
    # helpful answer, and it comes from the same property that preserves the
    # prefix: adding a URI to `proxy_pass` to remove the redirect would break
    # every path the door publishes.
    location /api/ {
        proxy_pass http://claudio_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # ---- the MCP surface -------------------------------------------------
    #
    # `proxy_buffering off` is the whole reason this location is separate.
    # Buffered, a streamed reply arrives all at once when the upstream closes,
    # which to a client is indistinguishable from a hang -- and the failure
    # mode is a model waiting on a tool call that has already been answered.
    # It costs nothing for the single-object POST this service speaks today
    # and it is correct for the streamed one it may speak tomorrow.
    location = /mcp {
        proxy_pass http://claudio_mcp/mcp;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        client_max_body_size 1m;
    }

    # ---- /healthz IS DELIBERATELY NOT EXPOSED ---------------------------
    #
    # It asks for no token -- the door serves it ABOVE the reader check on
    # purpose, so a monitor with no credential can still tell a half-functional
    # door from a dead one -- and it names the store root, the engine's
    # availability and the free bytes on the filesystem.  That is an operator's
    # question, asked from inside the network the door binds on, not from the
    # internet.
    #
    # This block is what makes the default a DECISION rather than an oversight:
    # omitting the route would answer the same 404 from the catch-all below and
    # say nothing about why.
    #
    # AND THE REMEDY IS NOT A DROP-IN, WHICH IS WHY IT DOES NOT SAY IT IS.  A
    # `server-*.conf` carrying a second `location = /healthz` is a DUPLICATE
    # exact location and nginx refuses to start on it -- so an operator who
    # wants it published mounts their own copy of this file over
    # `claudio-locations.conf`, which is one file and is exactly the routes.
    # Suggesting the drop-in would have been advice that stops the proxy.
    location = /healthz {
        return 404 '{"outcome":"unanswerable","refusal":{"reason":"not-exposed","detail":"/healthz is not published by this proxy: it asks for no token and names the store root, the engine and the free bytes","remedy":"ask the door directly from inside the network it binds on, or mount your own claudio-locations.conf"}}';
        default_type application/json;
    }

    # ---- everything else -------------------------------------------------
    #
    # A 404 WITH NO ROUTE OUT OF IT IS HOW A CLIENT AUTHOR CONCLUDES THE SERVER
    # IS BROKEN.  This one names the three routes that exist, in the envelope
    # the API uses everywhere else, so a wrong path is answered by the same
    # shape as a wrong question.
    location / {
        return 404 '{"outcome":"unanswerable","refusal":{"reason":"no-such-route","detail":"this proxy serves three routes","remedy":"POST /sender to ship, GET /api/v1/... to read, POST /mcp for the MCP surface"}}';
        default_type application/json;
    }

    # The operator's own additions to THIS server.  A TLS server is not one of
    # them: it is a server block of its own and is included at http level, so
    # the two globs are disjoint by name (`server-*` here, `http-*` there).
    # One glob for both would try to include a whole `server { }` inside this
    # one.  A glob matching nothing is not an error, so an image with nothing
    # mounted here starts.
    include /etc/claudio/nginx.d/server-*.conf;
