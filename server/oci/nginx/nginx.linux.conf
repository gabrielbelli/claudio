# The Linux proxy image's main nginx configuration.
#
# It holds exactly what is BASE-SPECIFIC -- where nginx writes, what user it
# would run as, how it logs -- and `include`s `claudio.conf` and
# `claudio-tls.conf`, which hold the routes and the TLS server and are shared
# with the FreeBSD proxy image BYTE FOR BYTE.  Splitting them that way is the
# same rule the entrypoints follow: the thing that differs between two bases is
# small and lives in one place, and the decision everybody reads is stated once.
#
# THE PATHS ARE THE ONLY REAL DIFFERENCE FROM `nginx.freebsd.conf`.
#
#   nginx's prefix is `/etc/nginx` on Alpine and `/usr/local/etc/nginx` on
#   FreeBSD, and the two `include`s below are the only lines that care.  Every
#   route, every timeout, every body limit and the whole TLS server are in the
#   shared files and are not restated here -- a second copy of a location list
#   is how a route gets fixed on one image and not the other.
#
# THERE IS NO `user` DIRECTIVE, AND THAT IS DELIBERATE.
#
#   The image runs as 65534:65534, and `user` is meaningful only when the
#   master process is root.  With it, nginx prints "the 'user' directive makes
#   sense only if the master process runs with super-user privileges" on every
#   start -- a warning that trains people to ignore warnings.
#
# THERE IS NO `daemon off;` HERE EITHER.
#
#   `entrypoint-proxy.sh` passes `-g "daemon off;"`.  Both would be a duplicate
#   directive and nginx refuses to start on it, so this file must stay silent
#   about it -- and the entrypoint is the right half to carry it, because it
#   survives an operator mounting their own configuration over this one.

worker_processes auto;

# COMPILED-IN, AND UNWRITABLE BY THIS IMAGE'S UID.  `/var/run` belongs to the
# base image; the pid file is moved into the one directory the build chowns.
# Without this line nginx exits at startup with "open() /var/run/nginx.pid
# failed (13: Permission denied)".
pid /var/tmp/nginx/nginx.pid;

error_log stderr notice;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    log_format claudio '$remote_addr $request_method $uri $status '
                       '$body_bytes_sent ${request_time}s '
                       'ua="$http_user_agent"';

    # `/dev/stdout` rather than a file, so `docker logs` shows requests.  The
    # base image symlinks it for the `nginx` user; this image runs as 65534 and
    # writes to the device node directly, which any runtime provides.
    access_log /dev/stdout claudio;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout  65;

    # THE TEMPORARY DIRECTORIES ARE MOVED, AND THEY HAVE TO BE.  The Alpine
    # package's compiled-in paths are under `/var/cache/nginx`, owned by the
    # `nginx` user, and this image runs as 65534 -- so a request with a body
    # large enough to spill would fail on a write nobody can see coming.  One
    # directory, chowned once in the Containerfile, named once here.
    client_body_temp_path /var/tmp/nginx/client_body_temp;
    proxy_temp_path       /var/tmp/nginx/proxy_temp;
    fastcgi_temp_path     /var/tmp/nginx/fastcgi_temp;
    uwsgi_temp_path       /var/tmp/nginx/uwsgi_temp;
    scgi_temp_path        /var/tmp/nginx/scgi_temp;

    # The routes.  Shared with the FreeBSD proxy image, byte for byte.
    include /etc/nginx/claudio.conf;

    # TLS.  Also shared byte for byte, and also SHIPPED rather than mounted:
    # `entrypoint-proxy.sh` guarantees a certificate exists before nginx starts,
    # which is the condition that used to make shipping this unsafe.
    include /etc/nginx/claudio-tls.conf;

    # The operator's own server blocks.  `http-*.conf` here and `server-*.conf`
    # inside the server block, so the two globs cannot pick up each other's
    # files.  A glob matching nothing is not an error, so the image starts with
    # nothing mounted.
    include /etc/claudio/nginx.d/http-*.conf;
}
