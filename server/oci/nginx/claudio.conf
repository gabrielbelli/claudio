# The routes.  ONE FILE, SHARED BY THE FREEBSD AND THE LINUX PROXY IMAGE
# BYTE FOR BYTE, because the routes are one decision and a second copy is the
# one that goes stale.  What differs between the two bases is where nginx keeps
# its temporary directories and its logs, and that lives in the main
# configuration next to this file -- `nginx.freebsd.conf` here.
#
# This file is `include`d from inside `http { }`.  It declares the three
# upstreams and the plain-HTTP server; it sets no worker, pid, log or temp path, because
# those are the base's business and stating them twice is how the two images
# drift apart.
#
# WHAT THE PROXY IS FOR
#
#   One host, one port, one place for certificates.  The other three services
#   are not published at all: they bind inside the compose network and only
#   this image has a `ports:` mapping.
#
#       https://claudio.example.com/sender   -> ingest  POST /v1/ship
#       https://claudio.example.com/api/     -> api     GET  /api/v1/*
#       https://claudio.example.com/mcp      -> mcp     POST /mcp
#
#   THREE UPSTREAMS AND NOT TWO, AND THE FIRST TWO ARE THE SPLIT.  `/sender`
#   reaches the only process that writes; `/api/` reaches a process that holds
#   the store read-only, takes no store lock and cannot write a byte.  A single
#   upstream serving both -- which is what this file had while the door was one
#   image -- puts the query engine and the write lock in one process, which is
#   the thing the split exists to undo.
#
#   AND THE DOOR'S OWN REFUSAL IS STILL CORRECT BEHIND THIS PROXY, WHICH IS
#   WORTH WORKING OUT RATHER THAN ASSUMING.  `serve.py` refuses to serve an
#   unauthenticated read API on a non-loopback bind.  Inside a compose network
#   the api binds `0.0.0.0`, which `_is_loopback` reads as EXPOSED -- correctly,
#   because it is: every other container on that network can reach it, and so
#   can anything the operator publishes by accident.  So the refusal fires, and
#   it is satisfied the only way it may be satisfied, by mounting a
#   `readers.json`.  It is NOT satisfied by this proxy: nothing here adds
#   authentication and nothing here must.  Reader scope is decided in exactly
#   one place, by that file.
#
# `/api/` IS THE EXTERNAL PREFIX AND IT MAPS TO THE INTERNAL `/api/`.
#
#   The door describes itself with ABSOLUTE PATHS: OpenAPI `paths`,
#   `capabilities.endpoints[].path`, and the `remedy` on every refusal.  A
#   matching prefix makes all three correct as they stand.  Rename it -- serve
#   the API under `/v1/` or `/read/` and rewrite -- and the MCP surface breaks
#   first and silently, because it generates its entire tool list from those
#   paths: every tool would be built against a path that 404s from outside.
#   So this location has NO URI part in its `proxy_pass` and no `rewrite`.
#
# TLS IS SHIPPED, IN `claudio-tls.conf`, AND IT IS INCLUDED FROM THE MAIN
# CONFIGURATION BESIDE THIS FILE.
#
#   That is a reversal of an earlier decision and the reason is in that file:
#   nginx exits when `ssl_certificate` names a file that is not there, so TLS
#   could not be shipped until something guaranteed a certificate existed.
#   `entrypoint-proxy.sh` now does -- a mounted one if there is one, a
#   self-signed one it generates and announces if there is not -- so the
#   default configuration is the secure one rather than the one you reach after
#   reading a paragraph.
#
#   The server below listens on 8080 and speaks plain HTTP, and it stays:
#   a stack behind somebody else's terminator needs it, and so does a loopback
#   test that does not want to argue with a self-signed certificate.

# THE UPSTREAM NAMES ARE THE COMPOSE SERVICE NAMES, RESOLVED AT STARTUP.
#
# nginx resolves a name in an `upstream` block once, when the configuration is
# loaded, and EXITS if it cannot -- so a proxy started before the services it
# names exist
# refuses to start rather than answering 502 for the lifetime of the stack.
# That is the direction this project wants: `depends_on` is how the stack
# expresses the ordering, and a loud refusal at startup is readable where a
# steady 502 is a mystery.  Do not "fix" it by moving the address into a
# variable with a `resolver`: that defers the lookup and converts the refusal
# into exactly the silent 502 it replaced.
upstream claudio_ingest {
    server ingest:8787;
    keepalive 8;
}

upstream claudio_api {
    server api:8787;
    keepalive 8;
}

upstream claudio_mcp {
    server mcp:8788;
    keepalive 8;
}

server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    # RELATIVE, and that is what keeps this file shareable.  nginx resolves a
    # relative `include` against its own prefix -- `/usr/local/etc/nginx` on
    # FreeBSD, `/etc/nginx` on Debian -- so one spelling is right on both
    # bases.  An absolute path here would make this file base-specific, which
    # is exactly what the split into a main configuration and this one exists
    # to avoid.
    include claudio-locations.conf;
}
