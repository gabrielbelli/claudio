# TLS, AND IT IS SHIPPED RATHER THAN AN EXAMPLE.  THAT IS A REVERSAL, AND THE
# REASON IT COULD BE REVERSED IS RECORDED HERE RATHER THAN LOST.
#
#   This file used to be `http-tls.conf.example`, mounted by the operator, and
#   the reason given was exact: nginx EXITS at startup when `ssl_certificate`
#   names a file that is not there, so shipping a TLS server block would have
#   made the image refuse to run until somebody had certificates.  That reason
#   was true and is now answered.  `entrypoint-proxy.sh` guarantees a
#   certificate exists before it execs nginx -- a real one if it was mounted, a
#   self-signed one it generates and says so about if it was not -- so the
#   condition that made shipping this file unsafe no longer holds.
#
#   What that buys is the thing `--no-api` and `readers.json` buy elsewhere:
#   the secure configuration is the DEFAULT one rather than the one you get
#   after reading a paragraph.  `docker compose up` serves HTTPS on the first
#   run, on a fresh clone, with no certificate anywhere.
#
# ONE PLACE FOR THE CERTIFICATE AND THE DOMAIN, AND THIS IS NOT IT.
#
#   The paths below are FIXED, and the domain is not in this file at all.
#   `server_name _` matches any host, which is right for a single-vhost proxy
#   and is what makes this file identical on every deployment.  The two things
#   an operator actually chooses -- WHICH directory holds the certificate and
#   WHAT name it is for -- are `CLAUDIO_TLS_DIR` and `CLAUDIO_DOMAIN` in the
#   compose file's environment, read by `entrypoint-proxy.sh`.  One place, two
#   variables, and nothing in nginx's configuration to edit.
#
#   `/etc/claudio` is this stack's read-only secret mount -- the same place the
#   ingest service's `tokens.json` and the api's `readers.json` live, and for
#   the same reason: they are secrets, they are not records, and keeping them
#   out of the store means the store stays a directory that can be tailed,
#   backed up and handed to a log shipper without handing over the keys.
#
# WHY THE LOCATIONS ARE AN `include` AND NOT A COPY
#
#   `claudio-locations.conf` is the route list.  Both servers include the same
#   file, so a route fixed once is fixed on both listeners.  A copied location
#   block is the one that goes stale, and here the stale one would be the one
#   facing the internet.
#
# The include is RELATIVE: nginx resolves it against its own prefix, which is
# `/usr/local/etc/nginx` on FreeBSD and `/etc/nginx` on Debian and Alpine, so
# this file is the same under either image.

server {
    listen 8443 ssl;
    listen [::]:8443 ssl;
    http2 on;

    server_name _;

    ssl_certificate     /etc/claudio/tls/fullchain.pem;
    ssl_certificate_key /etc/claudio/tls/privkey.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:claudio:10m;
    ssl_session_timeout 1h;

    include claudio-locations.conf;
}

# THERE IS NO HTTP -> HTTPS REDIRECT, AND THAT IS A DECISION ABOUT THE
# DEPLOYMENT RATHER THAN ABOUT THIS STACK.
#
# A proxy that is itself behind a terminating load balancer must NOT redirect,
# or every request loops.  The plain server on 8080 is also how a stack behind
# somebody else's terminator is reached, and how a loopback test avoids a
# self-signed certificate.  Add one in your own file if your deployment wants
# it -- `/etc/claudio/nginx.d/http-*.conf` is included at http level:
#
#     server {
#         listen 8080;
#         listen [::]:8080;
#         server_name claudio.example.com;
#         return 308 https://$host$request_uri;
#     }
